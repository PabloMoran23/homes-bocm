name: Investigar entrada territorial
description: >
  Investiga una entrada territorial, incluyendo planeamiento, normativa,
  documentos y subastas; clasifica su asunto, relaciona padres y conserva
  también las investigaciones parciales o pendientes de identificar.

trigger:
  - type: cron
    schedule: "0 8 * * *"

repository:
  github: PabloMoran23/homes-bocm
  branch: main

tools:
  - memories

model: default

# El prompt operativo está en .cursor/prompts/investigar-proyecto.md
# Hay que pegarlo en Instructions de la UI. La UI no lee este path sola.
# Requiere migración aditiva 20261017140000_regional_research.sql y nuevo helper research_asunto.py.
instructions_file: .cursor/prompts/investigar-proyecto.md

sandbox:
  install_command: pip install psycopg2-binary
