name: Investigar proyecto importante
description: >
  Cada día reserva un proyecto sin investigación, priorizando fichas visitadas
  en sesiones humanas; investiga terreno, obras, actores y prensa y guarda
  transaccionalmente en Supabase con owner/token compartidos con Luna.

trigger:
  - type: cron
    schedule: "0 8 * * *"

repository:
  github: PabloMoran23/homes-bocm
  branch: main

tools:
  - memories

model: default

# El prompt operativo está en .cursor/prompts/investigar-proyecto.md
# Hay que pegarlo en Instructions de la UI. La UI no lee este path sola.
# Requiere migración 20261017120000_research_leases.sql y adopción con Cursor pausado.
instructions_file: .cursor/prompts/investigar-proyecto.md

sandbox:
  install_command: pip install psycopg2-binary
