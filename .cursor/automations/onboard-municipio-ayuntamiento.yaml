name: Onboard municipio ayuntamiento
description: >
  Cada 4 horas toma el siguiente municipio de la cola BOCM, investiga su portal,
  implementa el adapter de ingesta (metadatos + geometría si hay visor/GIS) y abre PR a main.

trigger:
  - type: cron
    schedule: "0 */4 * * *"

repository:
  github: PabloMoran23/homes-bocm
  branch: main

tools:
  - memories

model: default

# Referencia: el prompt operativo está en .cursor/prompts/onboard-municipio-ayuntamiento.md
# Hay que pegarlo manualmente en Instructions de la UI de Cursor Automations.
instructions_file: .cursor/prompts/onboard-municipio-ayuntamiento.md

sandbox:
  install_command: pip install -r requirements-municipio.txt && pip install psycopg2-binary
