name: Benicarlo sources read-only probe

on:
  push:
    branches: [probe/benicarlo-source-20261125]

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare three official municipal sources
        run: |
          python3 -u - <<'PY'
          import socket
          import time
          import urllib.parse
          import urllib.request
          import re
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor

          urls = {
              "benicarlo_board": ("https://benicarlo.sedipualba.es/tablondeanuncios/default.aspx", 75),
              "benicarlo_rss": ("https://benicarlo.sedipualba.es/tablondeanuncios/tablon_rss.aspx", 30),
              "benicarlo_services": ("https://benicarlo.sedipualba.es/catalogoservicios.aspx", 30),
              "benicarlo_public_planning": ("https://www.benicarlo.org/urb/purb-inf-pub.php", 25),
              "benicarlo_public_urbanism": ("https://www.benicarlo.org/urb/purb-iu-ip.php", 25),
              "vinaros_board": ("https://vinaros.sedelectronica.es/board", 25),
              "vinaros_planning": ("https://urbanisme.vinaros.es/es/contenido/planeamiento-urbanistico-municipal", 25),
              "benijofar_board": ("https://benijofar.sedelectronica.es/board", 25),
              "benijofar_rss": ("https://www.benijofar.es/category/noticias/tablon/feed/", 25),
              "benijofar_web": ("https://www.benijofar.es/category/noticias/tablon/", 25),
          }

          def fetch(item):
              name, (url, limit) = item
              start = time.monotonic()
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "poc-bocm-benicarlo-vinaros-benijofar/1.0"})
                  with urllib.request.urlopen(request, timeout=limit) as response:
                      payload = response.read()
                      rows = len(re.findall(rb"<tr(?:>|\s)", payload, re.I))
                      docs = len(re.findall(rb'href="[^"]+\.pdf', payload, re.I))
                      items = len(ET.fromstring(payload).findall(".//item")) if name.endswith("_rss") else None
                      return name, round(time.monotonic() - start, 2), response.status, len(payload), rows, docs, items, response.url
              except Exception as exc:
                  return name, round(time.monotonic() - start, 2), type(exc).__name__, str(exc)

          for host in ("benicarlo.sedipualba.es", "vinaros.sedelectronica.es", "benijofar.sedelectronica.es"):
              print("DNS", host, sorted({addr[4][0] for addr in socket.getaddrinfo(host, 443)}))
          with ThreadPoolExecutor(max_workers=10) as pool:
              for result in pool.map(fetch, urls.items()):
                  print(result)
          PY
