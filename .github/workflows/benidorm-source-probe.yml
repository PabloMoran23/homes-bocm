name: Benidorm source read-only probe

on:
  push:
    branches: [probe/benidorm-board-20261125]

permissions:
  contents: read

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check direct official endpoints
        run: |
          python3 -u - <<'PY'
          import hashlib
          import re
          import socket
          import time
          import urllib.parse
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          host = "https://sede.benidorm.org/eAdmin/"
          variants = {
              "canonical": (host + "Tablon.do?action=verAnuncios&tipoTablon=1", 70),
              "official_all": (host + "Tablon.do?action=verAnuncios", 45),
              "official_intro": (host + "Tablon.do?action=inicioTablon", 45),
              "official_home": ("https://sede.benidorm.org/inicio", 30),
              "municipal_site": ("https://www.benidorm.org/es/pagina/transparencia", 20),
          }

          def fetch(item):
              name, (url, limit) = item
              start = time.monotonic()
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "poc-bocm-benidorm/1.0"})
                  with urllib.request.urlopen(request, timeout=limit) as response:
                      payload = response.read()
                      rows = len(re.findall(rb"<tr(?:>|\s)", payload, re.I))
                      return name, round(time.monotonic() - start, 2), response.status, len(payload), rows, response.url
              except Exception as exc:
                  return name, round(time.monotonic() - start, 2), type(exc).__name__, str(exc)

          print("DNS", sorted({addr[4][0] for addr in socket.getaddrinfo("sede.benidorm.org", 443)}))
          with ThreadPoolExecutor(max_workers=5) as pool:
              for result in pool.map(fetch, variants.items()):
                  print(result)
          PY
