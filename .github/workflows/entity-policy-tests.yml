name: Entity policy regression
on:
  pull_request:
    paths: ['municipio/**', 'db/**', 'supabase/migrations/**', '.github/workflows/entity-policy-tests.yml']
  workflow_dispatch:
jobs:
  policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-municipio.txt
      - name: Classifications, queue, recovery, RPC and publication guards
        env:
          H01_TEST_DB_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
        run: python -m unittest municipio.test_entity_policy db.test_entity_reprocess -v
