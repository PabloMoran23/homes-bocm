name: Geography replay and recurring control
on:
  schedule:
    - cron: '42 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'municipio/**'
      - 'db/ingest.py'
      - 'db/reprocess_project_semantics.py'
      - 'db/requirements-supabase.txt'
      - 'db/test_geography_postgres.py'
      - 'data/municipios/**'
      - 'requirements-municipio.txt'
      - 'supabase/migrations/*geographic*'
      - '.github/workflows/geography-control.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-municipio.txt -r db/requirements-supabase.txt
      - run: python -m unittest discover -s municipio -t . -p 'test_*.py'
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: geography_test
          POSTGRES_DB: h03_geography_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d h03_geography_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-municipio.txt -r db/requirements-supabase.txt
      - name: Migration and legacy metadata integration on isolated PostGIS
        env:
          H03_TEST_DB_URL: postgresql://postgres:geography_test@127.0.0.1:5432/h03_geography_tests
          H03_SEMANTICS_ROOT: ${{ github.workspace }}
        run: python -m unittest db.test_geography_postgres -v
  recurring-control:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [offline, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-municipio.txt -r db/requirements-supabase.txt
      - name: Replay originals and queue unresolved geography (read only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            python -m municipio.geography_replay --database --report geography-replay-report.json
          else
            python -m municipio.geography_replay --report geography-replay-report.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geography-replay-report
          path: geography-replay-report.json
