name: License temporal contract
on:
  pull_request:
    paths:
      - 'db/**'
      - 'web/scripts/**'
      - 'web/lib/licencias-dashboard*'
      - 'web/components/madrid/dashboard/**'
      - 'tests/license-date-cases.json'
      - '.github/workflows/license-temporal-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  temporal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r db/requirements-supabase.txt
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: python db/test_license_dates.py
      - run: npm run test:license-dates
        working-directory: web
