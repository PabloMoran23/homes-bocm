name: Mislata source read-only probe

on:
  push:
    branches: [probe/mislata-source-20261125]

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check independent and shared-host official sources
        run: |
          python3 -u - <<'PY'
          import socket
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          from concurrent.futures import ThreadPoolExecutor

          sede = "https://mislata.sedipualba.es"
          municipal = "https://www.mislata.es"
          urls = {
              "rss": (sede + "/tablondeanuncios/tablon_rss.aspx", 75),
              "sede_html_board": (sede + "/tablondeanuncios/default.aspx", 35),
              "sede_catalogue": (sede + "/catalogoservicios.aspx", 35),
              "sede_home": (sede + "/", 25),
              "municipal_board": (municipal + "/es/informate/tablon-de-anuncios", 25),
              "municipal_planning": (municipal + "/es/transparencia/informacion-urbanistica-y-medioambiental/planeamientos-urbanisticos", 25),
              "municipal_urbanism": (municipal + "/es/administracion/oficina-virtual/urbanismo", 25),
              "icv": ("https://terramapas.icv.gva.es/0702_Planeamiento?service=WFS&version=2.0.0&request=GetFeature&typeNames=InventarioSuSuz&outputFormat=GML3&count=2", 25),
          }

          def fetch(item):
              name, (url, limit) = item
              start = time.monotonic()
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "poc-bocm-mislata/1.0"})
                  with urllib.request.urlopen(request, timeout=limit) as response:
                      payload = response.read()
                      items = len(ET.fromstring(payload).findall(".//item")) if name == "rss" else None
                      return name, round(time.monotonic() - start, 2), response.status, len(payload), items, response.url
              except Exception as exc:
                  return name, round(time.monotonic() - start, 2), type(exc).__name__, str(exc)

          print("DNS", sorted({addr[4][0] for addr in socket.getaddrinfo("mislata.sedipualba.es", 443)}))
          with ThreadPoolExecutor(max_workers=8) as pool:
              for result in pool.map(fetch, urls.items()):
                  print(result)
          PY
