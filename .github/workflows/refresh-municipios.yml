name: Ontinyent public endpoint diagnostics
run-name: Ontinyent public endpoint diagnostics
on:
  workflow_dispatch:
  push:
    branches: [diagnostic/ontinyent-public-endpoints-20261125]
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read official Ontinyent sources
        run: |
          getent ahostsv4 ontinyent.sedipualba.es | head -1
          printf '%s\n' 'https://ontinyent.sedipualba.es/tablondeanuncios/tablon_rss.aspx' \
            'https://ontinyent.sedipualba.es/tablondeanuncios/' 'https://ontinyent.sedipualba.es/catalogoservicios.aspx' \
            'https://www.ontinyent.es/va/pagina/pla-general-ontinyent-2007-modificacions' \
            'https://terramapas.icv.gva.es/0702_Planeamiento?service=WFS&request=GetCapabilities' \
          | while IFS= read -r endpoint; do
            curl -LsS --connect-timeout 7 --max-time 12 -o /dev/null \
              -w '%{http_code} %{remote_ip} %{time_connect} %{time_starttransfer} %{url_effective}\n' \
              "$endpoint" || printf 'curl failed for %s\n' "$endpoint"
          done
