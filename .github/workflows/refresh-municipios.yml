name: Elche public endpoint diagnostics
run-name: Elche public endpoint diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public Elche endpoints
        run: |
          set -u
          getent ahostsv4 sede.elche.es | head -1
          getent ahostsv4 sede.visitelche.com | head -1
          tablon='sta/CarpetaPublic/doEvent?APP_CODE=STA&PAGE_CODE=PTS2_TABLON&KEY=all&lang=ES'
          catalog='sta/CarpetaPublic/doEvent?APP_CODE=STA&PAGE_CODE=CATALOGO&lang=ES'
          printf '%s\n' "https://sede.elche.es/$tablon" "https://sede.visitelche.com/$tablon" \
            "https://sede.elche.es/$catalog" "https://sede.visitelche.com/$catalog" \
            'https://www.elche.es/urbanismo/tablon-anuncios/' 'https://elche.es/urbanismo/tablon-anuncios/' \
            'https://terramapas.icv.gva.es/0702_Planeamiento?service=WFS&request=GetCapabilities' \
          | while IFS= read -r endpoint; do
            curl -LsS --connect-timeout 7 --max-time 12 -o /dev/null \
              -w '%{http_code} %{remote_ip} %{time_connect} %{time_starttransfer} %{url_effective}\n' \
              "$endpoint" || printf 'curl failed for %s\n' "$endpoint"
          done
