name: Ceuta ministry sector source diagnostic
run-name: Ceuta ministry sector source diagnostic
on:
  push:
    branches: [diagnostic/ceuta-public-endpoints-20261125]
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the national SIU source for Ceuta
        run: |
          curl -fsSL --connect-timeout 9 --max-time 15 --get \
            'https://mapas.fomento.gob.es/arcgis/rest/services/SIU/%C3%81mbitos_o_Sectores/MapServer/0/query' \
            --data-urlencode "where=GIS_SIU.SIU.SECTORES_WM.ProvINE='51001' AND GIS_SIU.SIU.SECTORES_WM.FechaBaja='99999999'" \
            --data 'f=geojson&outFields=*&returnGeometry=true&outSR=4326&resultRecordCount=100' \
            -o "$RUNNER_TEMP/ceuta-sectors.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads((Path(os.environ['RUNNER_TEMP'])/'ceuta-sectors.json').read_text())
          rows = d.get('features') or []
          print('SIU authority yielded', len(rows), 'Ceuta sector geometries')
          assert d['type'] == 'FeatureCollection' and rows and all(row['geometry'] for row in rows)
          PY
