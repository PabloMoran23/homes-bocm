name: Ceuta public endpoint diagnostics
run-name: Ceuta public endpoint diagnostics
on:
  push:
    branches: [diagnostic/ceuta-public-endpoints-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public Ceuta sources
        run: |
          for host in www.ceuta.es ceuta.es sede.ceuta.es; do getent ahostsv4 "$host" | head -1; done
          printf '%s\n' 'https://www.ceuta.es/ceuta/trpgouce' 'https://ceuta.es/ceuta/trpgouce' \
            'https://www.ceuta.es/ceuta/bocce' 'https://ceuta.es/ceuta/bocce' \
            'https://www.ceuta.es/ceuta/pgou' \
            'https://sede.ceuta.es/controlador/controlador?cmd=publicacion&modulo=principal' \
            'https://boe.es/diario_boe/txt.php?id=BOE-A-2023-16918' \
            'https://arquitectosdeceuta.com/normativas/urbanismo/' \
          | while IFS= read -r endpoint; do
            curl -LsS -A 'poc-bocm-ceuta/1.0' --connect-timeout 7 --max-time 12 -o /dev/null \
              -w '%{http_code} %{remote_ip} %{time_connect} %{time_starttransfer} %{url_effective}\n' \
              "$endpoint" || printf 'curl failed for %s\n' "$endpoint"
          done
