name: Alberic public endpoint diagnostics
run-name: Alberic public endpoint diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read official Alberic sources
        run: |
          getent ahostsv4 alberic.sede.dival.es | head -1
          getent ahostsv4 alberic.sedipualba.es | head -1
          printf '%s\n' 'https://alberic.sede.dival.es/tablondeanuncios/tablon_rss.aspx' \
            'https://alberic.sede.dival.es/tablondeanuncios/' 'https://alberic.sedipualba.es/tablondeanuncios/tablon_rss.aspx' \
            'https://www.alberic.es/es/pagina/urbanismo' 'https://api.digitalvalue.es/alberic/collections/articulos' \
            'https://terramapas.icv.gva.es/0702_Planeamiento?service=WFS&request=GetCapabilities' \
          | while IFS= read -r endpoint; do
            curl -LsS -A 'Mozilla/5.0 (poc-bocm-alberic/1.0)' --connect-timeout 7 --max-time 12 -o /dev/null \
              -w '%{http_code} %{remote_ip} %{time_connect} %{time_starttransfer} %{url_effective}\n' \
              "$endpoint" || printf 'curl failed for %s\n' "$endpoint"
          done
