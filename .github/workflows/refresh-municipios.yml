name: Check Los Molinos public sources
on:
  push:
    branches: [diagnostic/los-molinos-public-endpoints-20261125]
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check official municipal and regional endpoints
        shell: bash
        run: |
          probe() {
            local name="$1" url="$2" rc=0
            shift 2
            local output
            output=$(curl --silent --show-error --location --connect-timeout 8 --max-time 15 \
              --user-agent 'poc-bocm-los-molinos/1.0' "$@" --output "/tmp/$name" \
              --write-out 'http=%{http_code} ip=%{remote_ip} connect=%{time_connect} tls=%{time_appconnect} total=%{time_total} bytes=%{size_download} type=%{content_type} final=%{url_effective}' "$url" 2>&1) || rc=$?
            printf '%s curl_exit=%s %s\n' "$name" "$rc" "$output"
            if [[ $rc -eq 0 && "$name" == 'sitcm' ]]; then
              jq -c '{type, numberMatched, count: (.features | length)}' "/tmp/$name" || true
            fi
          }
          sede='https://sede.ayuntamiento-losmolinos.es/eAdmin'
          wp='https://www.ayuntamiento-losmolinos.es'
          probe board "$sede/Tablon.do?action=verAnuncios" &
          probe board_search "$sede/Tablon.do?action=verAnuncios" --data-urlencode 'referenciaBusqueda=URBANISMO' &
          probe catalogue "$sede/Registrar.do?action=listadoEntradas" &
          probe transparency 'https://transparencia.ayuntamiento-losmolinos.es/?page_id=185' &
          probe urbanism "$wp/?page_id=36668" &
          probe wordpress_40276 "$wp/?p=40276" &
          probe wordpress_10954 "$wp/?p=10954" &
          probe sitcm 'https://idem.comunidad.madrid/geoserver3/ows' --get \
            --data-urlencode service=WFS --data-urlencode version=2.0.0 --data-urlencode request=GetFeature \
            --data-urlencode typeName=sitcm:VPLA_V_AMBITO --data-urlencode outputFormat=application/json \
            --data-urlencode srsName=EPSG:4326 --data-urlencode count=120 \
            --data-urlencode "CQL_FILTER=DS_MUNICIPIO='LOS MOLINOS'" &
          wait
