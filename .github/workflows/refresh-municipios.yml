name: Oviedo public endpoint diagnostics
run-name: Oviedo public endpoint diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    steps:
      - name: Read public Asturias endpoints
        run: |
          set -u
          getent ahostsv4 www54.asturias.es | head -1
          getent ahostsv4 sig.asturias.es | head -1
          query='rpgur/action/publico/busquedaConsulta?method=listPublico&idConcejo=44&estado=V&primeraVez=false&page=1'
          printf '%s\n' "https://www54.asturias.es/$query" "http://www54.asturias.es/$query" \
            'https://sig.asturias.es/server/rest/services/VisorRPGUR/Visor_RPGUR/FeatureServer?f=json' \
            'https://sigvisor.asturias.es/visorurbanismo/' 'https://www.asturias.es/' 'https://www.oviedo.es/urbanismo' \
          | while IFS= read -r endpoint; do
            curl -sS --connect-timeout 7 --max-time 12 -o /dev/null \
              -w '%{http_code} %{remote_ip} %{time_connect} %{time_starttransfer} %{redirect_url} %{url_effective}\n' \
              "$endpoint" || printf 'curl failed for %s\n' "$endpoint"
          done
