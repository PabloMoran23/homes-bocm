name: Candidate durable municipal reviews (opt-in)
on:
  workflow_dispatch:
    inputs:
      activate_candidate:
        description: "Run candidate despite incomplete adapter coverage (does not replace active refresh)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: refresh-municipios
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.activate_candidate == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-municipio.txt
            db/requirements-supabase.txt
      - run: pip install -r requirements-municipio.txt -r db/requirements-supabase.txt
      - name: Dispatch candidate reviews
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 -m municipio.refresh_dispatch
      - name: Preserve operational evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-review-candidate-${{ github.run_id }}
          path: refresh-report.json
          retention-days: 30
