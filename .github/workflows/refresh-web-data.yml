name: Refresh web data

on:
  workflow_dispatch:
    inputs:
      refresh_licencias:
        description: "Descargar y publicar licencias. Desactivar para actualizar solo SIGMA."
        type: boolean
        default: true
      seed_from_ref:
        description: "Solo siembra: publica en Supabase Storage los web/public/data de este commit, sin refrescar nada."
        type: string
        default: ""
  schedule:
    # Lunes 03:17 UTC (~05:17 CEST en verano) — SIGMA + visor
    - cron: "17 3 * * 1"
    # Día 17 de cada mes 03:17 UTC — refresco adicional
    - cron: "17 3 17 * *"

# Web data is published to Supabase Storage (bucket web-data), not to git.
permissions:
  contents: read

concurrency:
  group: refresh-web-data
  cancel-in-progress: false

jobs:
  seed:
    if: github.event_name == 'workflow_dispatch' && inputs.seed_from_ref != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Take web/public/data from the seed commit
        env:
          SEED_REF: ${{ inputs.seed_from_ref }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${SEED_REF}^{commit}"
          git checkout "$SEED_REF" -- web/public/data
          ls web/public/data | wc -l

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Publish web data to Supabase Storage
        working-directory: web
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_REF: ${{ inputs.seed_from_ref }}
        run: node scripts/publish-web-data.mjs --source "seed:$SEED_REF" --release-out ../web-data-release.json

      - name: Setup Python
        if: hashFiles('web-data-release.json') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record release in Supabase
        if: hashFiles('web-data-release.json') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pip install psycopg2-binary
          python3 db/record_web_data_release.py web-data-release.json

  refresh:
    if: github.event_name != 'workflow_dispatch' || inputs.seed_from_ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PGCONNECT_TIMEOUT: "15"
      PGOPTIONS: "-c statement_timeout=300000 -c lock_timeout=30000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore generated data cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: output
          key: poc-bocm-data-${{ github.run_id }}
          restore-keys: |
            poc-bocm-data-

      - name: Bootstrap generated data snapshot
        env:
          DATA_SNAPSHOT_URL: ${{ secrets.DATA_SNAPSHOT_URL }}
          DATA_SNAPSHOT_RELEASE_TAG: ${{ vars.DATA_SNAPSHOT_RELEASE_TAG || 'web-data-baseline' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f output/history_parsed_incremental.csv ]; then
            echo "Generated data baseline restored from cache."
            exit 0
          fi
          if [ -z "$DATA_SNAPSHOT_URL" ]; then
            echo "No DATA_SNAPSHOT_URL configured; trying release asset ${DATA_SNAPSHOT_RELEASE_TAG}."
            if gh release download "$DATA_SNAPSHOT_RELEASE_TAG" \
              --pattern poc-bocm-web-baseline.tgz \
              --output /tmp/poc-bocm-data.tgz; then
              tar -xzf /tmp/poc-bocm-data.tgz
              test -f output/history_parsed_incremental.csv
              exit 0
            fi
            echo "No release snapshot found; continuing to baseline guard."
          else
            curl --fail --location --show-error "$DATA_SNAPSHOT_URL" --output /tmp/poc-bocm-data.tgz
            tar -xzf /tmp/poc-bocm-data.tgz
            test -f output/history_parsed_incremental.csv
          fi

      - name: Check generated data baseline
        run: |
          if [ ! -f output/history_parsed_incremental.csv ]; then
            echo "Missing output/history_parsed_incremental.csv." >&2
            echo "" >&2
            echo "The refresh job needs the generated source-data baseline in the GitHub Actions cache," >&2
            echo "or a DATA_SNAPSHOT_URL secret pointing to a tar.gz with output/." >&2
            echo "This guard avoids overwriting web/public/data with" >&2
            echo "an empty first-run dataset." >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-data-refresh.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-data-refresh.txt

      - name: Verify license refresh regressions
        run: python3 -m unittest db.test_madrid_license_snapshot sector_geometry.test_madrid_licencias_download sector_geometry.test_madrid_licencias_current municipio.test_cli_errors municipio.test_madrid_pipeline

      - name: Check database connection before scraping
        timeout-minutes: 2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import psycopg2
          from db.ingest import pg_url
          with psycopg2.connect(pg_url(), connect_timeout=15) as conn:
              with conn.cursor() as cur:
                  cur.execute('SELECT 1')
          print('Supabase connection OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Several export scripts read the previous files; start from the live release.
      - name: Pull live web data from Supabase Storage
        working-directory: web
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: npm run pull-data

      - name: Verify license web contracts
        working-directory: web
        run: |
          node scripts/test-license-current.mjs
          npm run test:license-dates

      - name: Download Madrid public datasets
        timeout-minutes: 35
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is required for direct public data sync." >&2
            exit 1
          fi
          python3 -m municipio run --municipio madrid --step proyectos_update
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.refresh_licencias }}" != "false" ]; then
            MADRID_LICENCIAS=1 python3 -m municipio run --municipio madrid --step licencias_update
          fi

      - name: Publish Madrid datasets in Supabase
        timeout-minutes: 60
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_licencias }}" = "false" ]; then
            args+=(--projects-only)
          fi
          python3 -m db.refresh_madrid "${args[@]}"

      - name: Activate classification policy when needed
        timeout-minutes: 60
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 -m db.entity_reprocess --ensure-active

      - name: Prepare blind entity review sample
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 db/audit_entity_activity.py --output output/entity-review.json

      - uses: actions/upload-artifact@v4
        with:
          name: entity-review-sample
          path: output/entity-review.json
          retention-days: 30

      - name: Build public data files
        timeout-minutes: 30
        working-directory: web
        env:
          BUILD_DATA_SCOPE: madrid-public
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run build-data

      - name: Verify Madrid dashboard stats
        run: |
          test -s web/public/data/madrid-dashboard-stats.json
          node -e "
          const s = require('./web/public/data/madrid-dashboard-stats.json');
          if (!s.sigma?.total) throw new Error('madrid-dashboard-stats.json sin agregados SIGMA');
          console.log(
            'Dashboard OK — sigma:', s.sigma.total,
            '| licencias:', s.licencias?.totalRows ?? 'n/a',
            '| generado:', s.generatedAt
          );
          "

      - name: Verify production build
        working-directory: web
        env:
          NEXT_PUBLIC_EDITION: public
          SKIP_BUILD_DATA: "1"
        run: npm run build

      # Every check above ran on these exact files. manifest.json switches last.
      - name: Publish web data to Supabase Storage
        working-directory: web
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run publish-data -- --source refresh-web-data --release-out ../web-data-release.json

      - name: Record release in Supabase
        if: hashFiles('web-data-release.json') != ''
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 db/record_web_data_release.py web-data-release.json

      - name: Save generated data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: output
          key: poc-bocm-data-${{ github.run_id }}
