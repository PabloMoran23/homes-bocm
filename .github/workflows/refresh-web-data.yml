name: Refresh web data

on:
  workflow_dispatch:
    inputs:
      refresh_licencias:
        description: "Descargar licencias (desactivar solo para reexportar la caché)"
        type: boolean
        default: true
  schedule:
    # Lunes 03:17 UTC (~05:17 CEST en verano) — SIGMA + visor
    - cron: "17 3 * * 1"
    # Día 17 de cada mes 03:17 UTC — refresco adicional
    - cron: "17 3 17 * *"

permissions:
  contents: write

concurrency:
  group: refresh-web-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PGCONNECT_TIMEOUT: "15"
      PGOPTIONS: "-c statement_timeout=300000 -c lock_timeout=30000"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore generated data cache
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: output
          key: poc-bocm-data-${{ github.run_id }}
          restore-keys: |
            poc-bocm-data-

      - name: Bootstrap generated data snapshot
        env:
          DATA_SNAPSHOT_URL: ${{ secrets.DATA_SNAPSHOT_URL }}
          DATA_SNAPSHOT_RELEASE_TAG: ${{ vars.DATA_SNAPSHOT_RELEASE_TAG || 'web-data-baseline' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f output/history_parsed_incremental.csv ]; then
            echo "Generated data baseline restored from cache."
            exit 0
          fi
          if [ -z "$DATA_SNAPSHOT_URL" ]; then
            echo "No DATA_SNAPSHOT_URL configured; trying release asset ${DATA_SNAPSHOT_RELEASE_TAG}."
            if gh release download "$DATA_SNAPSHOT_RELEASE_TAG" \
              --pattern poc-bocm-web-baseline.tgz \
              --output /tmp/poc-bocm-data.tgz; then
              tar -xzf /tmp/poc-bocm-data.tgz
              test -f output/history_parsed_incremental.csv
              exit 0
            fi
            echo "No release snapshot found; continuing to baseline guard."
          else
            curl --fail --location --show-error "$DATA_SNAPSHOT_URL" --output /tmp/poc-bocm-data.tgz
            tar -xzf /tmp/poc-bocm-data.tgz
            test -f output/history_parsed_incremental.csv
          fi

      - name: Check generated data baseline
        run: |
          if [ ! -f output/history_parsed_incremental.csv ]; then
            echo "Missing output/history_parsed_incremental.csv." >&2
            echo "" >&2
            echo "The refresh job needs the generated source-data baseline in the GitHub Actions cache," >&2
            echo "or a DATA_SNAPSHOT_URL secret pointing to a tar.gz with output/." >&2
            echo "This guard avoids overwriting web/public/data with" >&2
            echo "an empty first-run dataset." >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-data-refresh.txt

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-data-refresh.txt

      - name: Verify license refresh regressions
        run: python3 -m unittest db.test_madrid_license_snapshot sector_geometry.test_madrid_licencias_download sector_geometry.test_madrid_licencias_current municipio.test_cli_errors municipio.test_madrid_pipeline

      - name: Check database connection before scraping
        timeout-minutes: 2
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'PY'
          import psycopg2
          from db.ingest import pg_url
          with psycopg2.connect(pg_url(), connect_timeout=15) as conn:
              with conn.cursor() as cur:
                  cur.execute('SELECT 1')
          print('Supabase connection OK')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Verify license web contracts
        working-directory: web
        run: |
          node scripts/test-license-current.mjs
          npm run test:license-dates

      - name: Refresh Madrid public datasets
        timeout-minutes: 60
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is required for direct public data sync." >&2
            exit 1
          fi
          REFRESH_LIC=1
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.refresh_licencias }}" = "false" ]; then
            REFRESH_LIC=0
          fi
          python3 -m municipio run --municipio madrid --step proyectos_update
          python3 -m municipio run --municipio madrid --step enrich_geometry
          python3 -m municipio run --municipio madrid --step geocode
          if [ "$REFRESH_LIC" = "1" ]; then
            echo "Licencias y declaraciones: descarga de los CSV actuales desde 2023 y upsert."
            MADRID_LICENCIAS=1 python3 -m municipio run --municipio madrid --step licencias_update
          else
            echo "Licencias: se reexporta el JSONL cacheado si existe (sin descarga)."
            python3 -m municipio run --municipio madrid --step licencias_update
          fi
          python3 -m municipio run --municipio madrid --step sync_supabase
          python3 -c "
          from pathlib import Path
          p = Path('output/municipios/madrid/proyectos.jsonl')
          if not p.is_file():
              raise SystemExit('Missing output/municipios/madrid/proyectos.jsonl')
          n = sum(1 for line in p.open() if line.strip())
          print(f'Madrid JSONL OK — proyectos: {n}')
          if n < 1:
              raise SystemExit('proyectos.jsonl vacío')
          "


      - name: Reclassify changed entities and check activity
        timeout-minutes: 30
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 db/entity_reprocess.py

      - name: Prepare blind entity review sample
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python3 db/audit_entity_activity.py --output output/entity-review.json

      - uses: actions/upload-artifact@v4
        with:
          name: entity-review-sample
          path: output/entity-review.json
          retention-days: 30

      - name: Build public data files
        timeout-minutes: 30
        working-directory: web
        env:
          BUILD_DATA_SCOPE: madrid-public
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: npm run build-data

      - name: Verify Madrid dashboard stats
        run: |
          test -s web/public/data/madrid-dashboard-stats.json
          node -e "
          const s = require('./web/public/data/madrid-dashboard-stats.json');
          if (!s.sigma?.total) throw new Error('madrid-dashboard-stats.json sin agregados SIGMA');
          console.log(
            'Dashboard OK — sigma:', s.sigma.total,
            '| licencias:', s.licencias?.totalRows ?? 'n/a',
            '| generado:', s.generatedAt
          );
          "

      - name: Verify production build
        working-directory: web
        env:
          NEXT_PUBLIC_EDITION: public
          SKIP_BUILD_DATA: "1"
        run: npm run build

      - name: Commit refreshed web data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git add -f web/public/data/madrid-dashboard-stats.json
          if git diff --cached --quiet; then
            echo "No web data changes to commit."
          else
            git commit -m "Refresh web data (incl. madrid-dashboard-stats.json)"
            git push
          fi

      - name: Save generated data cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: output
          key: poc-bocm-data-${{ github.run_id }}
