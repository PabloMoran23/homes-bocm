name: Regional research identities
on:
  pull_request:
    paths:
      - 'db/research_asunto.py'
      - 'db/save_proyecto_info_extra.py'
      - 'db/test_regional_research_postgres.py'
      - 'supabase/migrations/20261017140000_regional_research.sql'
      - 'supabase/migrations/20261017160000_unify_regional_investigations.sql'
      - 'web/lib/proyecto-info-extra.ts'
      - 'web/components/project-detail/ProyectoInfoExtraPanel.tsx'
      - 'web/scripts/test-proyecto-info-extra.mjs'
      - '.cursor/prompts/investigar-proyecto.md'
      - '.github/workflows/regional-research.yml'
  push:
    branches: [main]
    paths:
      - 'db/research_asunto.py'
      - 'db/save_proyecto_info_extra.py'
      - 'db/test_regional_research_postgres.py'
      - 'supabase/migrations/20261017140000_regional_research.sql'
      - 'supabase/migrations/20261017160000_unify_regional_investigations.sql'
      - 'web/lib/proyecto-info-extra.ts'
      - 'web/components/project-detail/ProyectoInfoExtraPanel.tsx'
      - 'web/scripts/test-proyecto-info-extra.mjs'
      - '.github/workflows/regional-research.yml'
jobs:
  regional:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: regional
          POSTGRES_DB: regional_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - env:
          TEST_REGIONAL_DB_URL: postgresql://postgres:regional@localhost:5432/regional_test
        run: python -m unittest discover -s db -p 'test_regional_research_postgres.py' -v

  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: node scripts/test-proyecto-info-extra.mjs
        working-directory: web
