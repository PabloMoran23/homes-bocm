name: Shared research leases
on:
  pull_request:
    paths:
      - 'db/research_lease.py'
      - 'db/save_proyecto_info_extra.py'
      - 'db/test_research_leases_postgres.py'
      - 'supabase/migrations/20261017120000_research_leases.sql'
      - '.cursor/prompts/investigar-proyecto.md'
      - '.github/workflows/research-leases.yml'
      - 'docs/research-shared-protocol.md'
  push:
    branches: [main]
    paths:
      - 'db/research_lease.py'
      - 'db/save_proyecto_info_extra.py'
      - 'db/test_research_leases_postgres.py'
      - 'supabase/migrations/20261017120000_research_leases.sql'
      - '.cursor/prompts/investigar-proyecto.md'
      - '.github/workflows/research-leases.yml'
      - 'docs/research-shared-protocol.md'
jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: research
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install psycopg2-binary
      - name: Shared leases, atomic saves and human analytics priority
        env:
          TEST_RESEARCH_DB_URL: postgresql://postgres:research@localhost:5432/research_test
        run: python -m unittest discover -s db -p 'test_research_leases_postgres.py' -v
