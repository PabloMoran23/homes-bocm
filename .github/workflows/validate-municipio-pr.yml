name: Validate municipio PR
on:
  pull_request:
    branches: [main]
    paths:
      - "data/municipios/**"
      - "municipio/adapters/**"
      - "scripts/ci/municipio_batch.py"
      - "scripts/ci/test_municipio_batch.py"
      - ".github/workflows/validate-municipio-pr.yml"
      - ".github/workflows/municipio-post-merge.yml"
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-municipio.txt
      - name: Test batch isolation and validation
        run: |
          python -m unittest discover -s scripts/ci -p 'test_municipio_batch.py'
          python -m unittest municipio.test_onboarding_snapshot
      - name: Validate every changed municipality
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts/ci')
          from municipio_batch import changed_slugs
          from municipio.manifest import load_manifest
          slugs = changed_slugs(os.environ['BASE_SHA'])
          for slug in slugs:
              subprocess.run(['bash', 'scripts/check-municipio-pr-static.sh', slug], check=True)
              manifest = load_manifest(slug)
              assert manifest.portal.adapter
          print(json.dumps({'checked': slugs}))
          PY
