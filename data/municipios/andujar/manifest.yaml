      - "https://www.andujar.es/areas-municipales/servicios-infraestructuras-y-urbanismo"
      - "https://www.andujar.es/areas-municipales/servicios-infraestructuras-y-urbanismo?tx_news_pi1=266"
    sede_seeds:
      - "https://sede.andujar.es/"
      - "https://sede.andujar.es/Editors/DlgTramiteSede.aspx"
  notes: |
    Web TYPO3 (área Servicios, Infraestructuras y Urbanismo) + sede ASP.NET propia.
    Planeamiento publicado en BOJA (PGOU, sector NS-2) y consulta SITUADIFUSION.
    Licencias vía catálogo de trámites sede (sin tablón espublico público scrapeable).
    geometry_status: partial (VITUA regional; sin visor municipal ArcGIS).

licencias:
  enabled: true

