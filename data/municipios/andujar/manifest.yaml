slug: andujar
nombre: "Andújar"
provincia: Jaén
comunidad_autonoma: andalucia

portal:
  base_url: "https://sede.andujar.es"
  adapter: municipio.adapters.andujar:AndujarAyuntamientoAdapter
  config:
    web_base: "https://www.andujar.es"
    sede_base: "https://sede.andujar.es"
    request_delay_s: 0.35
    portal_timeout_s: 25
    insecure_ssl: true
    user_agent: "poc-bocm-andujar/1.0"
