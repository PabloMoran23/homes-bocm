slug: arona
nombre: "Arona"
provincia: "Arona"
comunidad_autonoma: canarias
boletin_source_id: boc_canarias

portal:
  base_url: "https://www.arona.org"
  adapter: municipio.adapters.arona:AronaAyuntamientoAdapter
  config:
    web_base: "https://www.arona.org"
    sede_base: "https://sede.arona.org"
    sta_base: "https://sta.arona.org"
    request_delay_s: 0.35
    sede_insecure_ssl: true
    user_agent: "poc-bocm-arona/1.0"
    centroid: [28.0997, -16.6810]
  notes: |
    Portal DNN (arona.org/Areas-Municipales/Urbanismo): PGOU, convenios, proyectos
    de urbanización, plan especial Las Galletas, noticias y PDFs.
    Sede STA (sta.arona.org PAGE_CODE=TABLON) con dataset_TABLON embebido (503 intermitente).
    Trámites licencias en /Areas-Municipales/Urbanismo/Tramites (DNN).
    Urbamap (emapext.arona.org) visor TAO eMap sin API GeoJSON pública.

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento
