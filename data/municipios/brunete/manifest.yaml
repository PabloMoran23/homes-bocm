  adapter: municipio.adapters.brunete:BruneteAyuntamientoAdapter
  config:
    sede_base: "https://brunete.sedelectronica.es"
    board_url: "https://brunete.sedelectronica.es/board/"
    urbanismo_url: "https://brunete.org/concejalias/urbanismo/"
    geoportal_url: "https://mun.nexusgeographics.com/brunetegp/"
    request_delay_s: 0.35
    user_agent: "poc-bocm-brunete/1.0 (+urbanismo research)"
  notes: |
    Fuentes: tablón eHome (board), PGOU PDFs en web urbanismo, trámites informativos licencia.

licencias:
  enabled: true

