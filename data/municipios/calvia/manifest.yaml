    Plone calvia.com: RSS planeamiento (tramitación, PGOU revisión, vigente) y anuncios.
    Licencias de obra: WFS IDELMA M011_EXP_OBRA (~20k puntos georreferenciados).
    Visores SITMUN (sitmun.idelma.cat) PGOU vigente/tramitación; sin join expediente↔polígono en listados RSS.

licencias:
