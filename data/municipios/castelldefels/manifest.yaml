slug: castelldefels
nombre: "Castelldefels"
provincia: Barcelona
comunidad_autonoma: catalunya

portal:
  base_url: "https://www.castelldefels.org"
  adapter: municipio.adapters.castelldefels:CastelldefelsAyuntamientoAdapter
  config:
    web_base: "https://www.castelldefels.org"
    sede_base: "https://seu.castelldefels.org"
    request_delay_s: 0.35
    user_agent: "poc-bocm-castelldefels/1.0"
    max_crawl_pages: 30
    geometry:
      arcgis_expedients_layer: "https://geoportal.amb.cat/geoserveisapp/rest/services/Planejament/Expedients/MapServer/3"
      cod_ine_mun: "08056"
  notes: |
    Plone: planeamiento en trámite / planes aprobados / vigente (PDFs y artículos).
    Sede STA TAO: catálogo CATALOGO → dataset_CATSERV (licencias como trámites).
    Tablón PTS2_TABLON carga vía submitAjax.aa; anuncios en e-Tauler (idens=805690004).
    Geometría: AMB Planejament/Expedients layer 3 (INE 08056, polígonos por expediente).

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento
