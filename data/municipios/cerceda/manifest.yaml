slug: cerceda
nombre: "Cerceda"
provincia: Madrid
comunidad_autonoma: comunidad-madrid

portal:
  base_url: "https://elboalo-cerceda-mataelpino.org"
  adapter: municipio.adapters.cerceda:CercedaAyuntamientoAdapter
  config:
    request_delay_s: 0.35
    user_agent: "poc-bocm-cerceda/1.0"
    sede_insecure_ssl: true
    sede_base: "https://sede.elboalo-cerceda-mataelpino.org/eAdmin"
    espublico_base: "https://elboalo.sedelectronica.es"
    wp_api_base: "https://elboalo-cerceda-mataelpino.org/wp-json/wp/v2"
    seed_pages:
      - "https://elboalo-cerceda-mataelpino.org/normativa-urbanistica/"
      - "https://elboalo-cerceda-mataelpino.org/urbanismo/"
      - "https://elboalo-cerceda-mataelpino.org/portal-de-transparencia/"
    geometry:
      wfs_url: "https://idem.comunidad.madrid/geoserver3/ows"
      type_name: "sitcm:VPLA_V_AMBITO"
      municipio_filter: "EL BOALO"
  notes: |
    Cerceda es localidad del Ayuntamiento de El Boalo, Cerceda y Mataelpino.
    Portal compartido WordPress + sede add4u + espublico board.
    NOTA: cerceda.es redirige a Cerceda (A Coruña, Galicia) — no usar.

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento
