      arcgis_layer_url: "https://geoservicios.castillalamancha.es/arcgis/rest/services/Vector/Planeamiento_Municipal/MapServer/0"
      cod_ine: "02037"
  notes: |
    Web oficial Joomla (www.hellin.es; certificado SSL caducado — insecure_ssl).
    Sede Sedipualba hellin.sedipualba.es: tablón RSS/HTML + catálogo trámites (área Urbanismo).
    Enlace legacy eAdmin Diputación Albacete (entidad 02037) redirige a sede municipal.
