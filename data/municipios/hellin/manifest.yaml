slug: hellin
nombre: "Hellín"
provincia: Albacete
comunidad_autonoma: castilla-mancha

portal:
  base_url: "https://hellin.sedipualba.es"
  adapter: municipio.adapters.hellin:HellinAyuntamientoAdapter
  config:
    sede_base: "https://hellin.sedipualba.es"
    web_base: "https://www.hellin.es"
    tablon_rss: "https://hellin.sedipualba.es/tablondeanuncios/tablon_rss.aspx"
    tablon_url: "https://hellin.sedipualba.es/tablondeanuncios/default.aspx"
    eadmin_tablon: "https://eadmin.dipualba.es/tablondeanuncios/default.aspx?entidad=02037"
    request_delay_s: 0.35
    user_agent: "poc-bocm-hellin/1.0"
    insecure_ssl: true
    centroid: [38.5106, -1.6972]
