              [-1.92, 38.28],
              [-1.44, 38.28],
              [-1.44, 38.72],
              [-1.92, 38.72],
              [-1.92, 38.28],
            ]
      crs: EPSG:4326
      axis_order: xy
      source: "bbox aproximado Hellín (Albacete) + PGOU CLM COD_INE=02037"
