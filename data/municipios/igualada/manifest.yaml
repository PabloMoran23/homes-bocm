    Web corporativa Plone (CA): secció Urbanisme amb arxius e-tauler (PDFs per projecte/IP).
    e-Tràmits (tramits.igualada.cat) — tràmits de llicències/obres sense llistat de concessions.
    Tauler d'edictes a seu-e.cat (Liferay, càrrega dinàmica). RPUC 08102 per metadades expedient.

licencias:
  enabled: true

