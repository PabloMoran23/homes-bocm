      geometry:
        type: Polygon
        coordinates:
          - [
              [-3.98, 40.02],
              [-3.70, 40.02],
              [-3.70, 40.22],
              [-3.98, 40.22],
              [-3.98, 40.02],
            ]
      crs: EPSG:4326
      axis_order: xy
      source: "bbox Illescas (La Sagra, Toledo)"
