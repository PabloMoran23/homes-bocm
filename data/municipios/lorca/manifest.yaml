slug: lorca
nombre: "Lorca"
provincia: Murcia
comunidad_autonoma: murcia

portal:
  base_url: "https://www.portalciudadano.lorca.es"
  adapter: municipio.adapters.lorca:LorcaAyuntamientoAdapter
  config:
    request_delay_s: 0.35
    user_agent: "poc-bocm-lorca/1.0"
    sede_base: "https://www.portalciudadano.lorca.es"
    urbanismo_base: "https://urbanismo.lorca.es"
    web_base: "https://www.lorca.es"
    tablon_url: "https://www.portalciudadano.lorca.es/web/guest/tablon-de-anuncios"
    catalogo_url: "https://www.portalciudadano.lorca.es/web/guest/catalogo-de-servicios"
    wfs_url: "https://mapas-gis-inter.carm.es/geoserver/SIT_USU_PLA_URB_CARM/wfs?service=WFS&version=2.0.0&request=GetFeature&typeNames=SIT_USU_PLA_URB_CARM:plu_ze_37_mun_uso_suelo&CQL_FILTER=Municipio%3D%27Lorca%27&count=1000&outputFormat=application/json&srsName=EPSG:4326"
    cod_ine: "30024"
    centroid: [37.6712, -1.7017]
  notes: |
    Tablón Liferay (portalciudadano) + documentación PGMO/PEPRI en urbanismo.lorca.es.
    Geometría parcial vía WFS planeamiento SITMURCIA (ámbitos UA-*).

licencias:
  enabled: true
  notes: Tablón sede (edictos licencia/obra) + trámites catálogo USTREC/URMPGM.

proyectos:
  enabled: true
  source: ayuntamiento

geometry:
  validation:
    source_crs: EPSG:4326
    coordinates_crs: EPSG:4326
    axis_order: xy
