# Maracena (Granada) — portal WordPress + sede espublico gestiona

slug: maracena
nombre: "Maracena"
provincia: Granada
comunidad_autonoma: andalucia

portal:
  base_url: "https://maracena.es"
  adapter: municipio.adapters.maracena:MaracenaAyuntamientoAdapter
  config:
    request_delay_s: 0.35
    user_agent: "poc-bocm-maracena/1.0"
    sede_base: "https://maracena.sedelectronica.es"
    web_base: "https://maracena.es"
    board_url: "https://maracena.sedelectronica.es/board/"
    urbanismo_url: "https://maracena.es/tematicas/urbanismo/normas-subsidiarias/"
    insecure_ssl: false
    centroid_lat: 37.21047460167404
    centroid_lng: -3.640068752285678
  notes: |
    WordPress maracena.es (REST API restringida): se usan feeds RSS por categoría (urbanismo, proyectos, reparcelaciones, arquitectura).
    Sede electrónica espublico: tablón de anuncios HTML.
    SITUA (Junta) como referencia de planeamiento; sin geometría por expediente en fuentes públicas consumibles.

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento
