    Sede Sedipualba (tablón RSS, catálogo área Urbanisme 1139) + portal Drupal
    (urbanismo, planeamiento vigente, PGOU en transparencia) + capas de planeamiento
    SU/SUZ vía WFS ICV (InventarioSuSuz, cod_ine_mun 46171).
licencias:
  enabled: true
