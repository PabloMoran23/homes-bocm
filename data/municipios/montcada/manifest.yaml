slug: montcada
nombre: "Montcada / Moncada"
provincia: Valencia
comunidad_autonoma: comunitat-valenciana
portal:
  base_url: https://www.moncada.es
  adapter: municipio.adapters.moncada:MoncadaAyuntamientoAdapter
  config:
    request_delay_s: 0.35
    user_agent: poc-bocm-montcada/1.0
