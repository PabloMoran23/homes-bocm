    source_crs: EPSG:4326
    axis_order: xy
    coordinates_crs: EPSG:4326
    coordinates_axis_order: xy
    municipal_boundary:
      geometry:
        type: Polygon
        coordinates:
          - - [-0.18, 38.84]
            - [-0.03, 38.84]
            - [-0.03, 38.96]
            - [-0.18, 38.96]
            - [-0.18, 38.84]
      crs: EPSG:4326
      axis_order: xy
