    WordPress Divi: noticias urbanismo (categoría WP 135) + PDFs PGOU/PEI en planes.
    Sede eprinsa (Diputación Córdoba): tablón Ember SPA sin API pública scrapeable.
    Sin visor GIS municipal accesible.

licencias:
  enabled: true

proyectos:
