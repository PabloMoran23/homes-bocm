slug: pineda-de-mar
nombre: "Pineda de Mar"
provincia: Barcelona
comunidad_autonoma: catalunya

portal:
  base_url: "https://www.pinedademar.cat"
  adapter: municipio.adapters.pineda_de_mar:PinedaDeMarAyuntamientoAdapter
  config:
    request_delay_s: 0.35
    user_agent: "poc-bocm-pineda-de-mar/1.0"
    sede_base: "https://seu.pinedademar.cat/eAdmin"
    tablon_url: "https://seu.pinedademar.cat/eAdmin/Tablon.do?action=verAnuncios"
    centroid: [41.6278, 2.6883]
  notes: |
    Web Plone (urbanisme) + seu eAdmin Tablon.do (grup Urbanisme/Llicències).
    Geoportal sig2.pinedademar.org/pinedagis/visor/geoportal (no REST público localizado).
    SIAC legacy seu.pinedademar.org inaccesible desde red externa.

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento

geometry:
  validation:
    source_crs: EPSG:4326
    axis_order: xy
    coordinates_crs: EPSG:4326
    municipal_boundary:
      type: Polygon
      coordinates:
        - - [2.615, 41.585]
          - [2.755, 41.585]
          - [2.755, 41.665]
          - [2.615, 41.665]
          - [2.615, 41.585]
      crs: EPSG:4326
      axis_order: xy
      source: "bbox aproximado término municipal (costa Maresme)"