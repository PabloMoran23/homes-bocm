slug: sant-adria-de-besos
nombre: "Sant Adrià de Besòs"
provincia: Barcelona
comunidad_autonoma: catalunya

portal:
  base_url: "https://www.sant-adria.cat"
  adapter: municipio.adapters.sant_adria_de_besos:SantAdriaDeBesosAyuntamientoAdapter
  config:
    web_base: "https://www.sant-adria.cat"
    sede_base: "https://seu.sant-adria.net"
    request_delay_s: 0.35
    user_agent: "poc-bocm-sant-adria-de-besos/1.0"
