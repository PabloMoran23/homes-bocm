    municipal_boundary:
      geometry:
        type: Polygon
        coordinates:
          - - [2.08, 41.31]
            - [2.22, 41.31]
            - [2.22, 41.36]
            - [2.08, 41.36]
            - [2.08, 41.31]
      crs: EPSG:4326
      axis_order: xy
      source: "bbox aproximado término municipal (IGN intermitente en cloud)"
