      arcgis_expedients_layer: "https://geoportal.amb.cat/geoserveisapp/rest/services/Planejament/Expedients/MapServer/3"
      arcgis_sectors_layer: "https://geoportal.amb.cat/geoserveisapp/rest/services/Planejament/Sectors/MapServer/0"
      cod_ine_mun: "08169"
