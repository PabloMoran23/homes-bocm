    Plone: secció Territori → Urbanisme (IP planejament, publicitat, convenis).
    Sede STA TAO (seu.sant-adria.net): catálogo CATSERV; tablón PTS2_TABLON vacío.
    Seu-e AOC: classificació urbanisme (tràmits informatius).
    Geometría: AMB Planejament/Expedients (CODI_INE 08169).

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento

geometry:
