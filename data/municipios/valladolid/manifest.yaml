slug: valladolid
nombre: "Valladolid"
provincia: Valladolid
comunidad_autonoma: castilla-y-leon

portal:
  base_url: "https://www.valladolid.gob.es"
  adapter: municipio.adapters.valladolid:ValladolidAyuntamientoAdapter
  config:
    request_delay_s: 0.35
    user_agent: "poc-bocm-valladolid/1.0"
    centroid_lat: 41.652946
    centroid_lon: -4.728390
    tablon_timeout_s: 45
    plai_max_pages: 12
    plai_page_size: 15
    plai_municipio: 186
    plai_provincia: 47
    drous_years: [2026, 2025]
    drous_page_size: 1000
    geometry:
      kind: arcgis_featureserver
      drous_layers:
        - year: 2026
          layer_id: 7
          url: "https://gisava.valladolid.es/server/rest/services/SDE_Drous_2026/FeatureServer/7"
        - year: 2025
          layer_id: 6
          url: "https://gisava.valladolid.es/server/rest/services/SDE_Drous_2025/FeatureServer/6"
  notes: |
    PLAU-i (Junta CyL) para instrumentos de planeamiento + tablón Proxia (IP reciente).
    Visor DROUS (ArcGIS FeatureServer) para licencias de obra con polígono catastral.
    Sede electrónica OpenCMS para trámites urbanismo (sin listado público de concesiones).

licencias:
  enabled: true

proyectos:
  enabled: true
  source: ayuntamiento
