<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homes — Mapa onboarding municipios</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e8eef7;
      --muted: #8b9cb3;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
      grid-template-rows: auto 1fr;
    }
    header {
      grid-column: 1 / -1;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: var(--panel);
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
    header .meta { color: var(--muted); font-size: 0.8rem; }
    aside {
      overflow-y: auto;
      padding: 16px;
      border-right: 1px solid var(--border);
      background: var(--panel);
    }
    #map { width: 100%; height: 100%; min-height: 400px; background: #0a0e14; }
    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .kpi {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .kpi .val { font-size: 1.4rem; font-weight: 700; }
    .kpi .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .section { margin-bottom: 18px; }
    .section h2 {
      margin: 0 0 8px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      margin-bottom: 10px;
    }
    .legend { display: flex; flex-direction: column; gap: 6px; }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .legend-item:hover { background: rgba(255,255,255,0.05); }
    .legend-item.off { opacity: 0.35; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3); }
    .map-legend-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-bottom: 14px;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.78rem;
    }
    .map-legend-icons span { display: inline-flex; align-items: center; gap: 6px; }
    .map-marker-wrap {
      background: transparent !important;
      border: none !important;
    }
    .map-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.85));
    }
    .map-marker.done {
      color: #22c55e;
      font-size: 26px;
      line-height: 1;
      font-weight: 700;
    }
    .map-marker.pending {
      width: 16px;
      height: 16px;
      border: 3px solid #94a3b8;
      border-radius: 50%;
      background: rgba(15, 20, 25, 0.55);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
    }
    .map-marker.pr {
      color: #fbbf24;
      font-size: 22px;
      line-height: 1;
    }
    .map-marker.skipped {
      color: #c084fc;
      font-size: 18px;
      line-height: 1;
    }
    .map-marker.failed {
      color: #f87171;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }
    .ccaa-bar { margin-bottom: 6px; }
    .ccaa-bar .row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      margin-bottom: 2px;
    }
    .ccaa-bar .track {
      height: 6px;
      background: var(--bg);
      border-radius: 3px;
      overflow: hidden;
    }
    .ccaa-bar .fill { height: 100%; background: linear-gradient(90deg, #10b981, #3b82f6); border-radius: 3px; }
    .info-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .info-box strong { color: #93c5fd; }
    .popup h3 { margin: 0 0 6px; font-size: 1rem; }
    .popup .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      margin-right: 4px;
      margin-bottom: 4px;
    }
    .popup dl { margin: 8px 0 0; font-size: 0.78rem; }
    .popup dt { color: var(--muted); float: left; clear: left; width: 110px; }
    .popup dd { margin: 0 0 4px 115px; }
    .popup a { color: #60a5fa; }
    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; }
      aside { max-height: 45vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Homes Urbanismo — Onboarding municipios</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="meta" id="automation-meta"></div>
  </header>
  <aside>
    <div class="kpis" id="kpis"></div>
    <div class="map-legend-icons">
      <span><strong style="color:#22c55e;font-size:1.1rem">★</strong> Hecho</span>
      <span><span class="map-marker pending" style="display:inline-block;width:14px;height:14px;border-width:2px"></span> Pendiente</span>
      <span><strong style="color:#fbbf24">●</strong> PR abierta</span>
      <span><strong style="color:#c084fc">◆</strong> Omitido</span>
    </div>
    <div class="section">
      <h2>Filtros</h2>
      <label for="search">Buscar</label>
      <input id="search" type="search" placeholder="Nombre o slug…" />
      <label for="ccaa">Comunidad autónoma</label>
      <select id="ccaa"><option value="">Todas</option></select>
      <label for="stage">Etapa</label>
      <select id="stage"><option value="">Todas</option></select>
    </div>
    <div class="section">
      <h2>Etapas (clic para filtrar)</h2>
      <div class="legend" id="legend"></div>
    </div>
    <div class="section">
      <h2>Progreso por CCAA</h2>
      <div id="ccaa-bars"></div>
    </div>
    <div class="section">
      <h2>Scrappers PDF + Automations</h2>
      <div class="info-box" id="extra-info"></div>
    </div>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    /*__DATA__*/

    const STAGE_COLORS = {
      done_ok: "#10b981",
      done_adapter: "#34d399",
      done_manifest: "#6ee7b7",
      done: "#059669",
      pr_abierta: "#f59e0b",
      manifest_pendiente: "#fb923c",
      in_progress: "#38bdf8",
      pending: "#64748b",
      failed: "#ef4444",
      skipped: "#a855f7",
    };

    let activeStages = new Set(Object.keys(STAGE_COLORS));
    let map, cluster;

    function fmtDate(iso) {
      if (!iso) return "—";
      try { return new Date(iso).toLocaleString("es-ES"); } catch { return iso; }
    }

    function popupHtml(m) {
      const tags = [
        `<span class="tag" style="background:${STAGE_COLORS[m.stage]}33;color:${STAGE_COLORS[m.stage]}">${m.stageLabel}</span>`,
        m.hasAdapter ? '<span class="tag" style="background:#1e3a5f;color:#93c5fd">adapter</span>' : "",
        m.openPrUrl ? '<span class="tag" style="background:#422006;color:#fcd34d">PR abierta</span>' : "",
      ].join("");
      const pr = m.openPrUrl || m.prUrl;
      return `<div class="popup">
        <h3>${m.nombre}</h3>
        ${tags}
        <dl>
          <dt>Slug</dt><dd>${m.slug}</dd>
          <dt>CCAA</dt><dd>${m.comunidadLabel}</dd>
          <dt>BOCM/CCAA</dt><dd>${m.bocmCount} proyectos</dd>
          <dt>Proyectos</dt><dd>${m.proyectosRows} filas (${m.withGeometry} geom)</dd>
          <dt>Licencias</dt><dd>${m.licenciasRows}</dd>
          <dt>Parity</dt><dd>${m.parityOverall || "—"}</dd>
          <dt>Actividad</dt><dd>${fmtDate(m.activityAt || m.lastRun)}</dd>
          ${pr ? `<dt>PR</dt><dd><a href="${pr}" target="_blank" rel="noopener">GitHub</a></dd>` : ""}
          ${m.portalUrl ? `<dt>Portal</dt><dd><a href="${m.portalUrl}" target="_blank" rel="noopener">Ayuntamiento</a></dd>` : ""}
        </dl>
      </div>`;
    }

    function filtered() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const ccaa = document.getElementById("ccaa").value;
      const stage = document.getElementById("stage").value;
      return MAP_DATA.municipios.filter((m) => {
        if (m.lat == null) return false;
        if (!activeStages.has(m.stage)) return false;
        if (ccaa && m.comunidadAutonoma !== ccaa) return false;
        if (stage && m.stage !== stage) return false;
        if (q && !(m.nombre.toLowerCase().includes(q) || m.slug.includes(q))) return false;
        return true;
      });
    }

    function markerKind(m) {
      if (m.status === "done") return "done";
      if (m.stage === "pr_abierta" || m.openPrUrl) return "pr";
      if (m.status === "skipped") return "skipped";
      if (m.status === "failed") return "failed";
      return "pending";
    }

    const MARKER_HTML = {
      done: '<div class="map-marker done" title="Hecho">★</div>',
      pending: '<div class="map-marker pending" title="Pendiente"></div>',
      pr: '<div class="map-marker pr" title="PR abierta">●</div>',
      skipped: '<div class="map-marker skipped" title="Omitido">◆</div>',
      failed: '<div class="map-marker failed" title="Fallido">✕</div>',
    };

    function makeIcon(kind) {
      return L.divIcon({
        className: "map-marker-wrap",
        html: MARKER_HTML[kind] || MARKER_HTML.pending,
        iconSize: [28, 28],
        iconAnchor: [14, 14],
        popupAnchor: [0, -14],
      });
    }

    function renderMarkers() {
      cluster.clearLayers();
      filtered().forEach((m) => {
        const kind = markerKind(m);
        const marker = L.marker([m.lat, m.lon], { icon: makeIcon(kind) });
        marker.bindPopup(popupHtml(m));
        cluster.addLayer(marker);
      });
    }

    function renderKpis() {
      const s = MAP_DATA.summary;
      document.getElementById("kpis").innerHTML = `
        <div class="kpi"><div class="val">${s.total}</div><div class="lbl">Total cola</div></div>
        <div class="kpi"><div class="val">${s.byStatus.done || 0}</div><div class="lbl">Hechos</div></div>
        <div class="kpi"><div class="val">${s.byStatus.pending || 0}</div><div class="lbl">Pendientes</div></div>
        <div class="kpi"><div class="val">${s.withGeo}</div><div class="lbl">En mapa</div></div>
        <div class="kpi"><div class="val">${s.openPrs || 0}</div><div class="lbl">PRs abiertas</div></div>
        <div class="kpi"><div class="val">${Math.round(100 * (s.byStatus.done || 0) / Math.max(1, s.total - (s.byStatus.skipped || 0)))}%</div><div class="lbl">% completado</div></div>`;
    }

    function renderLegend() {
      const el = document.getElementById("legend");
      el.innerHTML = "";
      Object.entries(MAP_DATA.stageLabels).forEach(([key, label]) => {
        const n = MAP_DATA.summary.byStage[key] || 0;
        const div = document.createElement("div");
        div.className = "legend-item" + (activeStages.has(key) ? "" : " off");
        div.innerHTML = `<span class="dot" style="background:${STAGE_COLORS[key]}"></span><span>${label} <strong>(${n})</strong></span>`;
        div.onclick = () => {
          if (activeStages.has(key)) activeStages.delete(key); else activeStages.add(key);
          renderLegend();
          renderMarkers();
        };
        el.appendChild(div);
      });
    }

    function renderCcaaBars() {
      const el = document.getElementById("ccaa-bars");
      const stats = MAP_DATA.byComunidadStats || {};
      const sorted = Object.entries(stats).sort((a, b) => b[1].total - a[1].total).slice(0, 12);
      el.innerHTML = sorted.map(([name, st]) => {
        const pct = Math.round(100 * st.done / Math.max(1, st.total - st.skipped));
        return `<div class="ccaa-bar"><div class="row"><span>${name}</span><span>${st.done}/${st.total} (${pct}%)</span></div><div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
      }).join("");
    }

    function renderExtra() {
      const a = MAP_DATA.automations || {};
      const sc = MAP_DATA.scrappers || {};
      document.getElementById("extra-info").innerHTML = `
        <strong>Automations Cursor</strong><br/>
        Onboard: cada 4h · Merge: cada 3 días<br/>
        PRs abiertas: ${a.openPrs || 0}<br/><br/>
        <strong>Scrappers PDF</strong> (${sc.framework || "scrappers/"})<br/>
        Verificados: ${(sc.verified || []).join(", ") || "—"}<br/>
        Última actividad: ${sc.lastRun || "—"}<br/>
        <em>${sc.note || ""}</em>`;
      if (MAP_DATA.next) {
        document.getElementById("extra-info").innerHTML += `<br/><br/><strong>Siguiente:</strong> ${MAP_DATA.next.nombre}`;
      }
    }

    function initFilters() {
      const ccaaSel = document.getElementById("ccaa");
      Object.entries(MAP_DATA.summary.byComunidad || {}).sort((a,b)=>b[1]-a[1]).forEach(([id, n]) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = `${MAP_DATA.municipios.find(m=>m.comunidadAutonoma===id)?.comunidadLabel || id} (${n})`;
        ccaaSel.appendChild(opt);
      });
      const stageSel = document.getElementById("stage");
      Object.entries(MAP_DATA.stageLabels).forEach(([k, v]) => {
        const opt = document.createElement("option");
        opt.value = k;
        opt.textContent = `${v} (${MAP_DATA.summary.byStage[k] || 0})`;
        stageSel.appendChild(opt);
      });
      ["search", "ccaa", "stage"].forEach((id) => {
        document.getElementById(id).addEventListener("input", renderMarkers);
        document.getElementById(id).addEventListener("change", renderMarkers);
      });
    }

    function init() {
      document.getElementById("meta").textContent =
        `Generado: ${fmtDate(MAP_DATA.generatedAt)} · Sin coords: ${MAP_DATA.summary.withoutGeo}`;
      document.getElementById("automation-meta").textContent =
        `Cola: ${MAP_DATA.summary.total} municipios con ≥1 proyecto BOCM/CCAA`;

      renderKpis();
      renderLegend();
      renderCcaaBars();
      renderExtra();
      initFilters();

      map = L.map("map", { center: [40.2, -3.5], zoom: 6, zoomControl: true });
      L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OSM &copy; CARTO",
        maxZoom: 19,
      }).addTo(map);

      cluster = L.markerClusterGroup({
        maxClusterRadius: 50,
        disableClusteringAtZoom: 11,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
      });
      map.addLayer(cluster);
      renderMarkers();

      const geo = filtered();
      if (geo.length) {
        const bounds = L.latLngBounds(geo.map((m) => [m.lat, m.lon]));
        map.fitBounds(bounds.pad(0.08));
      }
    }

    init();
  </script>
</body>
</html>
